<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />

        <!-- Favicons. The SVG is what modern browsers take; the .ico covers the
             bare /favicon.ico request, and the 32px PNG covers Safari 14, which
             is the browserslist floor and predates SVG favicon support. -->
        <link
            rel="icon"
            type="image/svg+xml"
            href="/favicon.svg" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon.png" />
        <link
            rel="icon"
            type="image/x-icon"
            href="/favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png" />

        <title>Ereuna</title>
        <meta
            name="description"
            content="Ereuna is a Web Application for Screening and Researching Financial Markets" />

        <!-- PLACEHOLDER ORIGIN — ereuna.io was the startup's domain and is gone,
             so pointing at it would be a link to somebody else's site. example.com
             is reserved by IANA and resolves nowhere, which is the property that
             makes it safe here; check-html-standards.mjs warns on every run while
             it is still in place. Swap it for a real domain at launch, and at that
             point also move `canonical` to per-route generation — one static
             canonical tells crawlers every route is the homepage. -->
        <link
            rel="canonical"
            href="https://ereuna.example.com/" />
        <meta
            property="og:type"
            content="website" />
        <meta
            property="og:url"
            content="https://ereuna.example.com/" />
        <meta
            property="og:title"
            content="Ereuna — market research" />
        <meta
            property="og:description"
            content="Screen the US equity universe, chart it, and track a portfolio against replayed trade history." />
        <meta
            property="og:image"
            content="https://ereuna.example.com/preview.png" />
        <meta
            name="twitter:card"
            content="summary_large_image" />

        <!-- Matches the `default` theme's --color-bg, so mobile browser chrome
             doesn't flash a light bar above a dark app on load. -->
        <meta
            name="theme-color"
            content="#1a1b26" />
    </head>

    <body>
        <div id="app"></div>
        <script
            type="module"
            src="/src/main.ts"></script>
    </body>
</html>
